name: CardSpring
description: 'CardSpring was a card-linked offers and payments platform that provided an API for
  building card-linked applications, letting developers connect merchant point-of-sale systems and
  consumer payment cards to deliver digital coupons, loyalty rewards, and receipt-level offers. It was
  surfaced as a portfolio company of Accel and DCVC and added to the API Evangelist network as a stub
  for enrichment. The company was acquired by Twitter in 2014 and subsequently wound down; as of this
  pass every path on cardspring.com (including the old /help/developer_faq.html) 307-redirects to an
  Afternic "cardspring.com is for sale" domain-sale lander, developer.cardspring.com fails TLS with no
  matching certificate, and no first-party CardSpring packages remain on npm or RubyGems. There is no
  live developer portal, documentation, API, or OpenAPI surface to enrich. Sector: payments.'
